[project]
name = "drusearch-embedder"
version = "0.1.0"
description = "DruSearch query embedder sidecar"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sentence-transformers==3.3.1",
  "torch==2.6.0+cpu",
  "pydantic==2.10.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
