[project]
name = "drusearch-pipelines"
version = "0.1.0"
description = "DruSearch ML & data pipelines"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]==3.2.3",
  "opensearch-py==2.8.0",
  "redis==5.2.1",
  "boto3==1.35.79",
  "mlflow==2.18.0",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "numpy==2.1.3",
  "scikit-learn==1.6.0",
  "lightgbm==4.5.0",
  "sentence-transformers==3.3.1",
  "torch==2.6.0+cpu",
  "tqdm==4.67.1",
  "tenacity==9.0.0",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "prefect==3.1.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipelines*"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
